    let currentIndex = 0;
    let playing = true;
    let timer = null;

    function renderSlide(idx) {
      currentIndex = idx;
      document.getElementById('screen').src = slides[currentIndex].image;
      document.getElementById('caption').innerText = slides[currentIndex].caption;
      document.getElementById('counter').innerText = 'Slide ' + (currentIndex + 1) + ' of ' + slides.length;
      document.getElementById('progress').style.width = ((currentIndex + 1) / slides.length * 100) + '%';
    }

    function nextSlide() {
      currentIndex = (currentIndex + 1) % slides.length;
      renderSlide(currentIndex);
    }

    function prevSlide() {
      currentIndex = (currentIndex - 1 + slides.length) % slides.length;
      renderSlide(currentIndex);
    }

    function startTimer() {
      timer = setInterval(nextSlide, 5000);
    }

    function togglePlay() {
      if (playing) {
        clearInterval(timer);
        document.getElementById('playBtn').innerText = '▶ Play';
      } else {
        startTimer();
        document.getElementById('playBtn').innerText = '⏸ Pause';
      }
      playing = !playing;
    }

    startTimer();
  </script>
